# Harmonic static hosting — the nginx expression of the same contract
# vercel.json encodes: SPA fallback, immutable hashed assets, a service worker
# that always revalidates, and microphone permission on the document.
#
# Terminate TLS in front of this (certbot on the host, or a reverse proxy).
# HTTPS is not optional: both the service worker and getUserMedia() refuse to
# run outside a secure context, so over plain HTTP the app loads but cannot
# record and cannot go offline.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Content-hashed filenames — a new build means a new name, so these can be
    # cached forever. A miss here is a real 404, never the SPA fallback.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Song files are unhashed and may be replaced in place: revalidate daily.
    location /midi-files/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Never let a stale service worker pin an old build. registerSW.js and the
    # manifest are unhashed for the same reason.
    location ~ ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Everything else falls back to the SPA shell.
    # NOTE: nginx's add_header does NOT inherit into blocks that declare their
    # own, so the document headers are repeated here rather than set at server
    # level — this is the block that serves index.html, which is where
    # Permissions-Policy has to land for getUserMedia to be allowed.
    location / {
        add_header Cache-Control "no-cache";
        add_header Permissions-Policy "microphone=(self)";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        try_files $uri $uri/ /index.html;
    }
}
