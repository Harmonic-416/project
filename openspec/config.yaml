schema: spec-driven

# Project context shown to AI when creating any artifact (proposal, specs, design, tasks).
context: |
  # Harmonic - project context (READ FIRST)

  Music-learning Progressive Web App (CSE 416 course project).
  Tagline: "Learn the instrument and the language at the same time."
  Design spine: teach the theory first, THEN the technique that proves it landed.
  V1 instruments: Guitar + Voice (Piano is future / out-of-scope). Single-player only.
  V1 experience: short guided lessons on an unlocking (Duolingo-style) map + a 3-song
  practice playlist with live microphone scoring.

  ## Locked tech stack (do NOT re-decide inside any change; treat as fixed constraint)
  - App shell: React + Vite, shipped as an installable PWA.
  - PWA infra: vite-plugin-pwa + Workbox (service worker, manifest, offline caching).
  - Backend: Supabase ONLY (Postgres + Auth + Storage) via its JS SDK / auto REST API.
    Deliberately thin - CRUD only for auth, per-user progress, scores, song files, attempt
    recordings. NO custom Node/Express server in V1, and none unless a future need cannot
    be expressed in Supabase.
  - Notation + reference playback, one renderer per instrument (decided at M2):
    guitar = alphaTab (tab + standard notation from Guitar Pro / alphaTex / MusicXML,
    built-in alphaSynth for reference audio, MIDI + Guitar Pro export); voice =
    OpenSheetMusicDisplay (standard notation from MusicXML; its cursor iterator gives the
    voice timing model) with Tone.js playback. Both read MusicXML.
  - Single-note / voice pitch: Pitchy (McLeod pitch method / autocorrelation).
  - Guitar chord verification: native Web Audio AnalyserNode FFT - peak-picking matched
    against the ONE expected chord's frequency fingerprint (verification, not arbitrary
    recognition) - plus RMS metering for dynamics and a cleanliness/"fuzziness" proxy. Raw
    FFT is reserved for chords; single notes use Pitchy (plain FFT peak-picking is
    unreliable on real instrument signals).
  - Timing/transport: Tone.js (BPM-aware clock) and/or alphaSynth's tempo-aware playback.
  - Theory helpers: Tonal.js (scales, intervals, chord names) for generators and labels.
  - Out-of-scope libs (do NOT build in V1): MediaPipe hand tracking (camera finger
    placement), any group/social sync infrastructure.

  ## Non-negotiable architecture rule (the whole design depends on it)
  ALL real-time audio analysis runs CLIENT-SIDE. Never stream mic audio to the server - it
  cannot meet note-by-note latency (target <=100 ms mic-to-score). Only results
  (scores/progress) and optional COMPRESSED attempt recordings leave the device.
  Data flow: mic (getUserMedia) -> AudioWorklet (raw PCM on its own thread) -> pluggable
  analyzers (pitch / chord-FFT / RMS-volume) -> instrument-agnostic scoring engine.
  Analyzers emit ONE normalized event shape: {note, timestamp, confidence}; the scoring
  engine never knows whether an event came from voice, a single string, or a chord.
  The renderer's parsed score is the single source of truth for "expected notes", and
  detected-vs-expected comparison runs on ONE transport clock (no drift). Adding an
  instrument = one new analyzer emitting the standard event shape; mic capture, worklet,
  and scoring engine stay untouched.

  ## Areas and capabilities (owning-capability taxonomy)
  Three areas, each with a foundation change: add-frontend-experience,
  add-backend-services, add-devops-infrastructure. Every capability is owned by exactly
  one area (no capability spans two); capabilities live at
  openspec/specs/<capability>/spec.md. Every in-scope V1 requirement (F#/N#) has a single
  PRIMARY owning capability whose spec.md carries it in a "### Requirement: ... (F#)"
  header. When in doubt, put a requirement's testable behavior with the capability that
  PRODUCES it, and reference (don't re-own) any collaborator.

  A few requirements are DELIBERATELY split across a control/effect boundary; each side
  specs only its own behavior and BOTH headers carry the id:
  - F30 (skip): `ui` owns the always-visible skip CONTROL; `scoring-engine` RECORDS the skip.
  - F37 (tempo): `notation-rendering` owns the tempo CONTROL (50-100%); `progress-tracking`
    PERSISTS the chosen tempo per song.
  - F4 (playlist + 3 songs): `ui` owns the playlist DISPLAY; `song-storage` owns the seeded
    3-song library it lists.
  - N5 (privacy): `song-storage` owns private-by-default recording STORAGE; `auth` owns the
    account-scoping/RLS that makes per-user isolation possible.

  FRONTEND (change: add-frontend-experience)
  - ui: lesson-map + lesson-flow display, practice playlist, run-through summaries (incl.
    patchy-area highlighting), live-feedback display, always-visible in-lesson skip control,
    hint presentation (fretboard finger-position animation), chord diagram with live
    per-string state, diagram label toggles. Owns: F3, F4, F12, F24, F30, F31, F34, F35.
  - tuner (added by change add-guitar-foundation): guitar tuner in the onboarding sound
    check - standard-tuning string targets, nearest-string detection with manual lock,
    cents readout + in-tune hysteresis, too-quiet state; first consumer of the shared
    AudioWorklet capture. Owns: F39.
  - audio-pipeline: getUserMedia + AudioWorklet capture; pitch / chord-FFT / RMS-volume
    analyzers emitting normalized {note,timestamp,confidence} events; noise/volume gating;
    low-latency + mobile-Safari viability; dynamics. Owns: F19, N1, N2, N6.
  - notation-rendering: alphaTab (guitar) / OSMD (voice) rendering, guitar notation
    conversion (Guitar Pro / alphaTex / MusicXML / MIDI in, MIDI + Guitar Pro out),
    reference playback/transport,
    countdown, click/drag-to-seek, tempo control, notation (solfege) label toggle, and
    random exercise/chord-progression generation producing renderable "expected notes".
    Owns: F5, F6, F7, F8, F15, F20, F36, F37.
  - scoring-engine: the instrument-agnostic brain - consumes events vs expected notes;
    hit/late/missed; guided vs play mode state machines; miss counting + soft auto-skip;
    guitar chord verification + cleanliness; strumming/timing score; post-run played-vs-
    score analysis; "couldn't hear you" state. Owns: F11, F13, F14, F16, F17, F18, F21,
    F28, F29, F32, F33.

  BACKEND (change: add-backend-services) - Supabase only
  - auth: Supabase register / login / session; the account anchors all per-user data.
    Owns: F1.
  - progress-tracking: per-user progress, the unlocking lesson map + prerequisite-clear
    rules, run-through history with last score. Owns: F2, F22.
  - song-storage: song library + MusicXML import (+ best-effort MuseScore/MIDI transform),
    attempt-recording storage, recording compression, private-by-default access (Supabase
    Storage + row-level security). Owns: F9, F10, F23, N3, N5.

  DEVOPS (change: add-devops-infrastructure)
  - pwa-infra: service worker, manifest, installability, offline caching of practice content
    via vite-plugin-pwa / Workbox. Owns: N4.
  - deployment: Vite production build, Supabase project + environment/secret config, hosting.
    Enabling substrate for every other capability; owns no numbered F#/N# of its own.

  ## V1 scope guardrails
  Explicitly OUT of V1 (list in each proposal's Non-goals; never build without a new
  change): CV finger placement (F25), group/social/collaboration/multi-instrument songs
  (F26), YouTube play-along scoring (F27), guitar "Changes" mode (F38), full-song
  playthroughs, a sheet-music-reading curriculum, advanced guitar technique
  (slides/bends/hammer-ons/pull-offs), piano, and an App Store release. Biggest project
  risk: real-time pitch detection on a phone in mobile Safari (N2) - validate on real
  hardware before building on top; desktop-first is the fallback. Authoritative requirement
  text lives (read-only) in specifications/2-scope/requirements.md.

# Per-artifact rules, shown to AI when creating each artifact type.
rules:
  proposal:
    - Keep to 1-2 pages, focused on WHY and WHAT (implementation HOW belongs in design.md).
    - Include a "## Non-goals" section referencing the v1-scope OUT list (CV/F25,
      group/F26, YouTube/F27, Changes mode/F38, piano) so scope creep stays visible.
    - Only propose capabilities and requirements in THIS change's own area; do not reach
      into another area's capabilities.
    - Under "### New Capabilities" list every capability the change adds by its exact
      kebab-case path (e.g. `audio-pipeline`), each mapping to specs/<capability>/spec.md.
  design:
    - Write design.md ONLY for genuine cross-capability decisions - e.g. the normalized
      {note,timestamp,confidence} event contract, the single shared transport clock, or a
      Supabase data model shared across capabilities. Skip it for a lone capability with no
      architectural choice to record.
    - Treat the locked tech stack as fixed constraint, never a fresh decision.
  tasks:
    - Chunk every task small enough to finish in <=~2 hours; order by dependency.
    - Group tasks under one "## <n>. <capability>" heading per capability the change owns.
    - Each task states how completion is verified (a test, command, or observable behavior).
  specs:
    - One spec file per capability at specs/<capability>/spec.md; begin each with a
      "## Purpose" line of 50+ characters (every V1 capability is brand-new).
    - Use "## ADDED Requirements" for new behavior. To change an existing requirement use
      "## MODIFIED Requirements", repeating its "### Requirement:" header exactly and giving
      the full new text (not a diff).
    - Every requirement uses a "### Requirement:" header naming it and MUST use SHALL/MUST
      (never should/may); it MUST carry at least one "#### Scenario:" with WHEN/THEN bullets.
    - Scenarios MUST use exactly four hashtags (####); three hashtags or bullets fail silently.
    - Tie each requirement to its F#/N# id (from specifications/2-scope/requirements.md) by
      putting the id in the "### Requirement:" HEADER, e.g. "### Requirement: User Login (F1)"
      - uniform, greppable convention. Enabling/infra requirements with no numbered owner
      (e.g. deployment) may omit the tag.
