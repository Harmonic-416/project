name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Backend layer (src/lib + Supabase migrations): lint, typecheck, tests.
  # Unit tests always run; the integration tests run only when the
  # SUPABASE_URL / SUPABASE_ANON_KEY secrets are configured (they skip
  # themselves otherwise). Point these at a DEDICATED test project, not prod.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

  # Frontend (app/): lint, unit tests, production build.
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # CD: apply supabase/migrations/ to the live project on merge to main.
  # Requires repo secrets: SUPABASE_ACCESS_TOKEN (dashboard → account →
  # access tokens) and SUPABASE_DB_PASSWORD (project database password).
  migrate:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref mxfclxntqbeznbubfmwa
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  # CD: deploy the PWA to Vercel production after the schema is migrated, so
  # the frontend never ships ahead of the database it talks to. Vercel builds
  # it remotely with the project's own env vars (VITE_SUPABASE_*).
  # Requires repo secrets: VERCEL_TOKEN (vercel.com/account/tokens, scoped to
  # the project's team), VERCEL_ORG_ID and VERCEL_PROJECT_ID (.vercel/project.json).
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [migrate]
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
